name: Publish Python to PyPI

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    permissions:
      # Audit F-15: SLSA build-provenance attestation needs an OIDC token
      # exchanged for a Sigstore signing cert, plus write access to push the
      # attestation to GitHub's attestation store.
      id-token: write
      attestations: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      - name: Determine version
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')

          git fetch --tags
          LATEST=$(git tag -l "python-v${BASE}.*" | sort -t. -k5 -n | tail -1)
          if [ -n "$LATEST" ]; then
            BUILD=$(echo "$LATEST" | grep -o '[0-9]*$')
            BUILD=$((BUILD + 1))
          else
            BUILD=1
          fi

          VERSION="${BASE}.${BUILD}"
          # PyPI version format: 0.0.1a1 (not 0.0.1-alpha.1)
          PYPI_VERSION=$(echo "$VERSION" | sed 's/-alpha\./a/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PYPI_VERSION=$PYPI_VERSION" >> $GITHUB_ENV
          echo "Building Python release: $PYPI_VERSION"

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.5.0
        with:
          python-version: '3.12'

      - name: Install Python build tools
        run: pip install build twine

      - name: Switch to CommandLineTools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Cross-compile native libraries
        run: |
          NATIVE_DIR=bindings/python/zerodev_aa/native

          # macOS arm64
          echo "=== Building aarch64-macos ==="
          rm -rf zig-out
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos
          mkdir -p "$NATIVE_DIR/darwin-aarch64"
          cp zig-out/lib/libzerodev_aa.dylib "$NATIVE_DIR/darwin-aarch64/"

          # macOS x86_64
          echo "=== Building x86_64-macos ==="
          rm -rf zig-out
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-macos
          mkdir -p "$NATIVE_DIR/darwin-x86-64"
          cp zig-out/lib/libzerodev_aa.dylib "$NATIVE_DIR/darwin-x86-64/"

          # Linux x86_64
          echo "=== Building x86_64-linux-gnu ==="
          rm -rf zig-out
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-gnu
          mkdir -p "$NATIVE_DIR/linux-x86-64"
          cp zig-out/lib/libzerodev_aa.so "$NATIVE_DIR/linux-x86-64/"

          # Linux arm64
          echo "=== Building aarch64-linux-gnu ==="
          rm -rf zig-out
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-gnu
          mkdir -p "$NATIVE_DIR/linux-aarch64"
          cp zig-out/lib/libzerodev_aa.so "$NATIVE_DIR/linux-aarch64/"

          echo "=== Bundled native libraries ==="
          find "$NATIVE_DIR" -type f | sort

      - name: Update version
        run: |
          cd bindings/python
          sed -i '' "s/version = \".*\"/version = \"${{ env.PYPI_VERSION }}\"/" pyproject.toml

      - name: Build wheel and sdist
        run: |
          cd bindings/python
          python -m build
          echo "=== Built packages ==="
          ls -la dist/

      - name: Attest build provenance (audit F-15)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: 'bindings/python/dist/*'

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd bindings/python
          twine upload dist/*

      - name: Generate SBOM (audit F-15) — uploaded as workflow artifact for inspection
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: bindings/python
          format: cyclonedx-json
          artifact-name: sbom-python.cdx.json
          upload-release-assets: false

      - name: Tag release
        run: |
          TAG="python-v${{ env.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged: $TAG"
