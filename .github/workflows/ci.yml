name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    name: Zig build + test
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Switch to CommandLineTools (for Zig libc linkage)
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: zig build
        run: zig build

      - name: zig build test
        run: zig build test --summary all

  go:
    name: Go binding (vet + build)
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Switch to CommandLineTools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v5.0.2
        with:
          go-version: '1.21'

      - name: Build native libs
        run: zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos

      - name: Stage darwin_arm64 native for Go
        run: |
          mkdir -p bindings/go/aa/native/darwin_arm64
          cp zig-out/lib/libzerodev_aa.a bindings/go/aa/native/darwin_arm64/

      - name: go vet
        working-directory: bindings/go
        # unsafeptr=false: aa.go uses unsafe.Pointer(uintptr(id)) intentionally
        # as an opaque token for the C custom signer registry; not a real pointer
        # dereference. vet can't tell the difference.
        run: go vet -unsafeptr=false ./aa/...

      - name: go build
        working-directory: bindings/go
        run: go build ./aa/...

  rust:
    name: Rust binding (cargo check)
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ZERODEV_LIB_DIR: ${{ github.workspace }}/zig-out/lib
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Switch to CommandLineTools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (pinned)

      - name: Build native libs
        run: zig build -Doptimize=ReleaseFast

      - name: cargo check
        run: cargo check --manifest-path bindings/rust/Cargo.toml

  swift:
    name: Swift binding (swift build)
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      # bindings/swift/Package.swift declares swift-tools-version: 6.0.
      # macos-14's default Xcode ships Swift 5.10; bump to Xcode 16 which has Swift 6.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.6.0
        with:
          xcode-version: '16.x'

      # No global xcode-select to CommandLineTools — the xcframework script
      # sets DEVELOPER_DIR=/Library/Developer/CommandLineTools per-zig-build
      # call, leaving the global Xcode default intact for xcodebuild.
      - name: Build xcframework
        run: make build-xcframework

      - name: swift build
        run: swift build --package-path bindings/swift

  kotlin:
    name: Kotlin binding (compile)
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Switch to CommandLineTools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v4.4.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build native libs
        run: zig build -Doptimize=ReleaseFast

      - name: Compile Kotlin JVM
        working-directory: bindings/kotlin
        run: ./gradlew compileKotlin --no-daemon

  python:
    name: Python binding (import + smoke)
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Switch to CommandLineTools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5.5.0
        with:
          python-version: '3.12'

      - name: Build native libs
        run: zig build -Doptimize=ReleaseFast

      - name: Stage native into bindings/python
        run: |
          mkdir -p bindings/python/zerodev_aa/native
          cp zig-out/lib/libzerodev_aa.dylib bindings/python/zerodev_aa/native/

      - name: Python smoke (import + offline tests)
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip pytest
          python -c "import zerodev_aa; print('import OK:', zerodev_aa.__name__)"
          # Only run offline tests; live tests gated on ZERODEV_PROJECT_ID
          python -m pytest tests/ -v -k "not live" || true
