name: Publish Kotlin to Maven Central

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: publish-kotlin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    permissions:
      # Audit F-15: SLSA build-provenance attestation needs an OIDC token
      # exchanged for a Sigstore signing cert, plus write access to push the
      # attestation. `contents: write` is needed to push the release tag.
      # (The Maven Central artifacts are also GPG-signed via OSSRH credentials.)
      id-token: write
      attestations: write
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      - name: Determine version
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')

          git fetch --tags
          # Extract trailing BUILD number and sort numerically; the old
          # `sort -t. -k5 -n` fell back to alphabetical (would break at BUILD >= 10).
          BUILD=$(git tag -l "kotlin-v${BASE}.*" | grep -oE '[0-9]+$' | sort -n | tail -1)
          if [ -n "$BUILD" ]; then
            BUILD=$((BUILD + 1))
          else
            BUILD=1
          fi

          VERSION="${BASE}.${BUILD}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building Kotlin release: $VERSION"

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.4.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Switch to CommandLineTools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Cross-compile desktop native libraries (JNI)
        run: |
          RESOURCE_DIR=bindings/kotlin/src/main/resources
          JNI_SRC=bindings/kotlin/jni/zerodev_aa_jni.c
          JNI_INC="$JAVA_HOME/include"

          # Helper: build static libs with Zig, repack for macOS, compile JNI bridge
          build_desktop() {
            local zig_target="$1" platform_dir="$2" ext="$3" cc="$4" extra_flags="$5"

            echo "=== Building $zig_target ==="
            rm -rf zig-out
            zig build -Doptimize=ReleaseFast -Dtarget=$zig_target -Dstatic-only=true

            # Repack archive for Xcode linker compatibility (macOS only). secp256k1
            # is bundled inside libzerodev_aa.a via zabi — single archive.
            if [[ "$ext" == "dylib" ]]; then
              tmpdir=$(mktemp -d)
              cd "$tmpdir"
              ar x "$GITHUB_WORKSPACE/zig-out/lib/libzerodev_aa.a"
              chmod 644 *.o
              libtool -static -o "$GITHUB_WORKSPACE/zig-out/lib/libzerodev_aa.a" *.o 2>/dev/null
              cd "$GITHUB_WORKSPACE"
              rm -rf "$tmpdir"
            fi

            # Compile JNI bridge + link with static libs
            mkdir -p "$RESOURCE_DIR/$platform_dir"
            $cc -shared -o "$RESOURCE_DIR/$platform_dir/libzerodev_aa.$ext" \
              -I"$JNI_INC" -I"$JNI_INC/darwin" -I"$JNI_INC/linux" -Iinclude \
              "$JNI_SRC" \
              $extra_flags \
              2>&1

            echo "Built: $RESOURCE_DIR/$platform_dir/libzerodev_aa.$ext"
          }

          # macOS arm64
          build_desktop "aarch64-macos" "darwin-aarch64" "dylib" "clang" \
            "-target arm64-apple-macos11 -Wl,-force_load,zig-out/lib/libzerodev_aa.a"

          # macOS x86_64
          build_desktop "x86_64-macos" "darwin-x86-64" "dylib" "clang" \
            "-target x86_64-apple-macos11 -Wl,-force_load,zig-out/lib/libzerodev_aa.a"

          # Linux x86_64 (use zig cc as cross-compiler)
          build_desktop "x86_64-linux-gnu" "linux-x86-64" "so" "zig cc -target x86_64-linux-gnu" \
            "-Wl,--whole-archive zig-out/lib/libzerodev_aa.a -Wl,--no-whole-archive -lc -lm"

          # Linux arm64 (use zig cc as cross-compiler)
          build_desktop "aarch64-linux-gnu" "linux-aarch64" "so" "zig cc -target aarch64-linux-gnu" \
            "-Wl,--whole-archive zig-out/lib/libzerodev_aa.a -Wl,--no-whole-archive -lc -lm"

          echo "=== Desktop native libraries ==="
          find "$RESOURCE_DIR" -type f -name "libzerodev_aa.*" | sort

      # Android JNI build currently fails on aarch64-linux-android with
      # `R_AARCH64_TLSLE_*` relocation errors when the Zig static lib
      # (containing threadlocal state) is linked into a `.so`. Tracked
      # separately; do NOT block the JVM release on it.
      - name: Cross-compile Android native libraries (JNI)
        continue-on-error: true
        run: |
          RESOURCE_DIR=bindings/kotlin/src/main/resources
          JNI_SRC=bindings/kotlin/jni/zerodev_aa_jni.c
          JNI_INC="$JAVA_HOME/include"

          NDK_HOME="${ANDROID_NDK_HOME:-$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | sort -V | tail -1)}"
          NDK_HOME="${NDK_HOME%/}"
          if [ -z "$NDK_HOME" ]; then
            echo "::error::Android NDK not found"
            exit 1
          fi
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/sysroot"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          echo "Using NDK: $NDK_HOME"

          for target_info in "aarch64:aarch64-linux-android:aarch64-linux-android21-clang:android-aarch64" \
                             "x86_64:x86_64-linux-android:x86_64-linux-android21-clang:android-x86-64"; do
            IFS=: read -r arch zig_target ndk_cc res_dir <<< "$target_info"
            echo "=== Building $zig_target ==="

            # Step 1: Zig builds static libs
            rm -rf zig-out
            C_INCLUDE_PATH="$SYSROOT/usr/include:$SYSROOT/usr/include/$arch-linux-android" \
              zig build -Doptimize=ReleaseFast -Dtarget=$zig_target -Dstatic-only=true \
              --sysroot "$SYSROOT"

            # Step 2: NDK clang compiles JNI bridge + links everything into .so
            mkdir -p "$RESOURCE_DIR/$res_dir"
            "$TOOLCHAIN/$ndk_cc" -shared -o "$RESOURCE_DIR/$res_dir/libzerodev_aa.so" \
              -I"$JNI_INC" -I"$JNI_INC/darwin" -I"$JNI_INC/linux" -Iinclude \
              "$JNI_SRC" \
              -Wl,--whole-archive zig-out/lib/libzerodev_aa.a -Wl,--no-whole-archive \
              -Wl,-z,max-page-size=16384 \
              -lc -lm -ldl

            echo "Built: $RESOURCE_DIR/$res_dir/libzerodev_aa.so"
          done

          # Also copy to AAR jniLibs/ for Android consumers
          JNILIBS_DIR=bindings/kotlin/android/src/main/jniLibs
          mkdir -p "$JNILIBS_DIR/arm64-v8a" "$JNILIBS_DIR/x86_64"
          cp "$RESOURCE_DIR/android-aarch64/libzerodev_aa.so" "$JNILIBS_DIR/arm64-v8a/"
          cp "$RESOURCE_DIR/android-x86-64/libzerodev_aa.so" "$JNILIBS_DIR/x86_64/"

          echo "=== Android native libraries ==="
          find "$JNILIBS_DIR" -type f -name "libzerodev_aa.*" | sort

      - name: Update version
        run: |
          cd bindings/kotlin
          sed -i '' "s/version = \".*\"/version = \"${{ env.VERSION }}\"/" build.gradle.kts
          echo "Version set to: ${{ env.VERSION }}"

      - name: Build and verify JVM JAR
        run: |
          cd bindings/kotlin
          # Build root (JVM) only — exclude android subproject
          ./gradlew clean :build -x test
          echo "=== JAR contents (native libs) ==="
          jar tf build/libs/zerodev-aa-jvm-${{ env.VERSION }}.jar | grep -E "(darwin|linux|android)" || true

      - name: Attest build provenance for JVM JAR (audit F-15)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: 'bindings/kotlin/build/libs/zerodev-aa-jvm-${{ env.VERSION }}.jar'

      - name: Publish JVM JAR to Maven Central
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd bindings/kotlin
          ./gradlew :publishToCentralPortal

      # Android artefacts are gated behind the same fix as the Android JNI
      # step above; `continue-on-error` here so the JVM path (already
      # published above) doesn't hold up SBOM / tag steps.
      - name: Build Android AAR
        continue-on-error: true
        run: |
          cd bindings/kotlin
          ./gradlew :android:assembleRelease

      - name: Attest build provenance for Android AAR (audit F-15)
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: 'bindings/kotlin/android/build/outputs/aar/*.aar'

      - name: Publish Android AAR to Maven Central
        continue-on-error: true
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd bindings/kotlin
          ./gradlew :android:publishToCentralPortal

      - name: Generate SBOM (audit F-15) — uploaded as workflow artifact for inspection
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: bindings/kotlin
          format: cyclonedx-json
          artifact-name: sbom-kotlin.cdx.json
          upload-release-assets: false

      - name: Tag release
        run: |
          TAG="kotlin-v${{ env.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged: $TAG"
