name: Release all

# Umbrella workflow that triggers every language's publish workflow in one click.
# Each called workflow handles its own version bump, native build, registry push,
# and tag creation. Workflows that push commits to main share the `publish-main`
# concurrency group so they serialize and avoid stomping on each other's pushes.
#
# Run via the Actions UI or:
#   gh workflow run release-all.yml

on:
  workflow_dispatch: {}

jobs:
  # Swift first — it pushes a checksum commit to main and creates the xcframework
  # release asset that the Swift SDK consumers fetch via SPM.
  build-xcframework:
    uses: ./.github/workflows/build-xcframework.yml
    secrets: inherit

  # Go pushes a commit to main with the rebuilt .a files. Sharing `publish-main`
  # concurrency group with build-xcframework ensures only one main-pusher at a time.
  publish-go:
    uses: ./.github/workflows/publish-go.yml
    secrets: inherit

  # Native libs release — uploaded as a GitHub Release asset that Rust's build.rs
  # downloads at compile time. Tag-only push, no main commit.
  publish-native-libs:
    uses: ./.github/workflows/publish-native-libs.yml
    secrets: inherit

  # Rust to crates.io. Tag-only push; native libs job runs inline.
  publish-rust:
    uses: ./.github/workflows/publish-rust.yml
    secrets: inherit

  # Python to PyPI. Tag-only push.
  publish-python:
    uses: ./.github/workflows/publish-python.yml
    secrets: inherit

  # Kotlin to Maven Central (both Android AAR and JVM JAR). Tag-only push.
  publish-kotlin:
    uses: ./.github/workflows/publish-kotlin.yml
    secrets: inherit
