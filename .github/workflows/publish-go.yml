name: Publish Go module

on:
  workflow_dispatch: {}
  workflow_call: {}

# Serialize concurrent publishes — the version-bump step reads existing tags
# and races would mint duplicate versions. (Tag-only commits, see below, mean
# we no longer race over a shared main ref.)
concurrency:
  group: publish-go
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    permissions:
      # Audit F-15: SLSA build-provenance attestation needs an OIDC token
      # exchanged for a Sigstore signing cert, plus write access to push the
      # attestation. `contents: write` is also needed to push the release tag.
      id-token: write
      attestations: write
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      - name: Determine version
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')

          git fetch --tags
          # Extract trailing BUILD number and sort numerically; the old
          # `sort -t. -k5 -n` fell back to alphabetical (would break at BUILD >= 10).
          BUILD=$(git tag -l "bindings/go/v${BASE}.*" | grep -oE '[0-9]+$' | sort -n | tail -1)
          if [ -n "$BUILD" ]; then
            BUILD=$((BUILD + 1))
          else
            BUILD=1
          fi

          VERSION="${BASE}.${BUILD}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Go module versions: v0.0.1-alpha.1
          echo "GO_TAG=bindings/go/v${VERSION}" >> $GITHUB_ENV
          echo "Building Go release: v$VERSION"

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Switch to CommandLineTools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Cross-compile and bundle native libraries
        run: |
          NATIVE_DIR=bindings/go/aa/native

          # Copy header
          mkdir -p "$NATIVE_DIR/include"
          cp include/aa.h "$NATIVE_DIR/include/"

          for target_info in "aarch64-macos:darwin_arm64" "x86_64-macos:darwin_amd64" "x86_64-linux-gnu:linux_amd64" "aarch64-linux-gnu:linux_arm64"; do
            IFS=: read -r zig_target go_dir <<< "$target_info"
            echo "=== Building $zig_target → $go_dir ==="

            rm -rf zig-out
            zig build -Doptimize=ReleaseFast -Dtarget=$zig_target -Dstatic-only=true

            # Repack for macOS linker compatibility (secp256k1 is bundled
            # inside libzerodev_aa.a via zabi — single archive)
            if [[ "$zig_target" == *macos* ]]; then
              tmpdir=$(mktemp -d)
              cd "$tmpdir"
              ar x "$GITHUB_WORKSPACE/zig-out/lib/libzerodev_aa.a"
              chmod 644 *.o
              libtool -static -o "$GITHUB_WORKSPACE/zig-out/lib/libzerodev_aa.a" *.o 2>/dev/null
              cd "$GITHUB_WORKSPACE"
              rm -rf "$tmpdir"
            fi

            mkdir -p "$NATIVE_DIR/$go_dir"
            cp zig-out/lib/libzerodev_aa.a "$NATIVE_DIR/$go_dir/"
          done

          echo "=== Bundled native libraries ==="
          find "$NATIVE_DIR" -name "*.a" -exec ls -lh {} \;

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.0.2
        with:
          go-version: '1.21'

      - name: Verify Go build
        run: |
          cd bindings/go
          CGO_ENABLED=1 go build ./aa/

      - name: Attest build provenance for bundled native libs (audit F-15)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: 'bindings/go/aa/native/**/libzerodev_aa.a'

      - name: Generate SBOM (audit F-15) — uploaded as workflow artifact for inspection
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-go.cdx.json
          upload-release-assets: false

      - name: Tag release (tag-only commit; main stays clean)
        # Audit F-22: previously this committed bundled .a files to main with
        # `[skip ci]`, bypassing any CI verification of the bytes downstream
        # consumers link against. We now write the release commit only at the
        # tag ref — `git push origin <tag>` pushes the tag + the commit it
        # points at, without advancing main. `go get @<tag>` resolves the tag
        # to the commit and fetches its tree, which contains the bundled .a
        # files; main never carries them.
        run: |
          TAG="${{ env.GO_TAG }}"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Go release tags are immutable."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f bindings/go/aa/native/
          git commit -m "release(go): bundled native libs for v${{ env.VERSION }}"

          git tag "$TAG"
          git push origin "$TAG"

          echo "Tagged: $TAG"
          echo ""
          echo "Go consumers can now:"
          echo "  go get github.com/${{ github.repository }}/bindings/go@$TAG"
