name: Publish Rust to crates.io

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: publish-rust
  cancel-in-progress: false

jobs:
  native-libs:
    runs-on: macos-14
    permissions:
      # Audit F-15: SLSA build-provenance attestation needs an OIDC token
      # exchanged for a Sigstore signing cert, plus write access to push the
      # attestation to GitHub's attestation store and the release.
      id-token: write
      attestations: write
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      hash_aarch64_macos: ${{ steps.hashes.outputs.aarch64_macos }}
      hash_x86_64_macos: ${{ steps.hashes.outputs.x86_64_macos }}
      hash_x86_64_linux_gnu: ${{ steps.hashes.outputs.x86_64_linux_gnu }}
      hash_aarch64_linux_gnu: ${{ steps.hashes.outputs.aarch64_linux_gnu }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0
        with:
          fetch-depth: 0  # need full tag history for version bump

      - name: Determine version (immutable, monotonic)
        id: version
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')

          # Both rust-v* and native-v* share the same BUILD counter so the
          # crate version and the native release version always line up.
          git fetch --tags --quiet
          LATEST=$(git tag -l "rust-v${BASE}.*" "native-v${BASE}.*" | sort -t. -k5 -n | tail -1)
          if [ -n "$LATEST" ]; then
            BUILD=$(echo "$LATEST" | grep -o '[0-9]*$')
            BUILD=$((BUILD + 1))
          else
            BUILD=1
          fi

          VERSION="${BASE}.${BUILD}"
          TAG="native-v${VERSION}"

          # Fail loud if the immutable tag already exists — never overwrite.
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Native release tags are immutable."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Native release: ${TAG}"

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Switch to CommandLineTools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Cross-compile and package
        run: |
          for target in aarch64-macos x86_64-macos x86_64-linux-gnu aarch64-linux-gnu; do
            echo "=== Building $target ==="
            rm -rf zig-out
            zig build -Doptimize=ReleaseFast -Dtarget=$target -Dstatic-only=true

            case "$target" in
              aarch64-macos) tag="aarch64-macos" ;;
              x86_64-macos)  tag="x86_64-macos" ;;
              x86_64-linux-gnu)  tag="x86_64-linux" ;;
              aarch64-linux-gnu) tag="aarch64-linux" ;;
            esac

            # zabi (since 0.18) bundles secp256k1 into std.crypto, so we no
            # longer ship a separate libsecp256k1.a archive.
            if [[ "$target" == *macos* ]]; then
              tmpdir=$(mktemp -d)
              cd "$tmpdir"
              ar x "$GITHUB_WORKSPACE/zig-out/lib/libzerodev_aa.a"
              chmod 644 *.o
              libtool -static -o "$GITHUB_WORKSPACE/zig-out/lib/libzerodev_aa.a" *.o 2>/dev/null
              cd "$GITHUB_WORKSPACE"
              rm -rf "$tmpdir"
            fi

            mkdir -p dist
            tar czf "dist/zerodev-aa-native-${tag}.tar.gz" \
              -C zig-out/lib libzerodev_aa.a \
              -C "$GITHUB_WORKSPACE" include/aa.h
          done

      - name: Compute SHA-256 manifest
        id: hashes
        # ponytail: macOS runners ship bash 3.2 (no associative arrays); pair
        # each asset_tag with its output key in one string, split with `read`.
        run: |
          for pair in \
            "aarch64-macos aarch64_macos" \
            "x86_64-macos x86_64_macos" \
            "x86_64-linux x86_64_linux_gnu" \
            "aarch64-linux aarch64_linux_gnu"; do
            read -r asset_tag key <<< "$pair"
            file="dist/zerodev-aa-native-${asset_tag}.tar.gz"
            hash=$(shasum -a 256 "$file" | awk '{print $1}')
            echo "${key}=${hash}" >> "$GITHUB_OUTPUT"
            echo "${asset_tag}: ${hash}"
          done

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Tags are immutable — fail rather than delete-and-recreate.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Native releases are immutable."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" dist/*.tar.gz \
            --title "Native libraries v${VERSION}" \
            --notes "Prebuilt static libraries for Rust binding (immutable; SHA-256 pinned in native-libs.sha256)."

      - name: Attest build provenance (audit F-15)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Generate SBOM (audit F-15)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.tag }}" dist/sbom.cdx.json

  publish:
    needs: native-libs
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (pinned)

      - name: Write native-libs.sha256 manifest
        run: |
          TAG="${{ needs.native-libs.outputs.tag }}"
          cat > bindings/rust/native-libs.sha256 <<EOF
          # Native library SHA-256 manifest — verified by bindings/rust/build.rs
          # after downloading the tarball from GitHub Releases.
          #
          # Auto-generated by .github/workflows/publish-rust.yml. Do not edit manually.
          #
          # Format:
          #   # tag: <release-tag>     ← used to build the GitHub Release asset URL
          #   <target>    <sha256>     ← lowercase hex, one line per target
          #
          # This file ships inside the published crate so consumers can verify the
          # downloaded native library matches what the crate author actually built.
          # Audit F-12 (https://linear.app/offchain-labs/issue/ZER-740).

          # tag: ${TAG}
          aarch64-macos      ${{ needs.native-libs.outputs.hash_aarch64_macos }}
          x86_64-macos       ${{ needs.native-libs.outputs.hash_x86_64_macos }}
          x86_64-linux-gnu   ${{ needs.native-libs.outputs.hash_x86_64_linux_gnu }}
          aarch64-linux-gnu  ${{ needs.native-libs.outputs.hash_aarch64_linux_gnu }}
          EOF
          cat bindings/rust/native-libs.sha256

      - name: Update version in Cargo.toml
        run: |
          VERSION="${{ needs.native-libs.outputs.version }}"
          cd bindings/rust
          sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "Cargo version set to: ${VERSION}"

      - name: Verify build (downloads + SHA-256-verifies native libs via build.rs)
        run: |
          cd bindings/rust
          # Force the auto-download path so we exercise verification end-to-end.
          unset ZERODEV_LIB_DIR
          cargo build --release

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd bindings/rust
          cargo publish --allow-dirty

      - name: Tag release
        run: |
          TAG="rust-v${{ needs.native-libs.outputs.version }}"
          VERSION="${{ needs.native-libs.outputs.version }}"

          # Commit the Cargo.toml bump + manifest so the tag points at a
          # buildable, integrity-verifiable state (not the dirty working tree).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bindings/rust/Cargo.toml bindings/rust/native-libs.sha256
          git commit -m "release: zerodev-aa ${VERSION}"

          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged: $TAG"
