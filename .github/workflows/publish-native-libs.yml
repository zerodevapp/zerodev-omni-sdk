name: Publish native libraries

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: publish-native-libs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    permissions:
      # Audit F-15: SLSA build-provenance attestation needs an OIDC token
      # exchanged for a Sigstore signing cert, plus write access to push the
      # attestation and create the release.
      id-token: write
      attestations: write
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      - name: Determine version
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION=$BASE" >> $GITHUB_ENV
          echo "TAG=native-v$BASE" >> $GITHUB_ENV
          echo "Building native libs: $BASE"

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Switch to CommandLineTools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Cross-compile and package
        run: |
          for target in aarch64-macos x86_64-macos x86_64-linux-gnu aarch64-linux-gnu; do
            echo "=== Building $target ==="
            rm -rf zig-out
            zig build -Doptimize=ReleaseFast -Dtarget=$target -Dstatic-only=true

            # Determine platform tag
            case "$target" in
              aarch64-macos) tag="aarch64-macos" ;;
              x86_64-macos)  tag="x86_64-macos" ;;
              x86_64-linux-gnu)  tag="x86_64-linux" ;;
              aarch64-linux-gnu) tag="aarch64-linux" ;;
            esac

            # Repack archives for macOS linker compatibility. zabi (since
            # 0.18) bundles secp256k1 into std.crypto, so we no longer ship a
            # separate libsecp256k1.a archive.
            if [[ "$target" == *macos* ]]; then
              tmpdir=$(mktemp -d)
              cd "$tmpdir"
              ar x "$GITHUB_WORKSPACE/zig-out/lib/libzerodev_aa.a"
              chmod 644 *.o
              libtool -static -o "$GITHUB_WORKSPACE/zig-out/lib/libzerodev_aa.a" *.o 2>/dev/null
              cd "$GITHUB_WORKSPACE"
              rm -rf "$tmpdir"
            fi

            # Package: tarball with .a file + header
            mkdir -p dist
            tar czf "dist/zerodev-aa-native-${tag}.tar.gz" \
              -C zig-out/lib libzerodev_aa.a \
              -C "$GITHUB_WORKSPACE" include/aa.h

            echo "Packaged: dist/zerodev-aa-native-${tag}.tar.gz"
          done

          echo "=== All packages ==="
          ls -la dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.TAG }}"

          # Delete existing release if any (allows re-running)
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true

          # Create tag and release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" dist/*.tar.gz \
            --title "Native libraries v${{ env.VERSION }}" \
            --notes "Prebuilt static libraries for Rust and Go bindings.

          **Platforms:** macOS (arm64, x86_64), Linux (arm64, x86_64)

          Each tarball contains:
          - \`libzerodev_aa.a\` — main SDK (with secp256k1 bundled via zabi)
          - \`include/aa.h\` — C header"

      - name: Attest build provenance (audit F-15)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Generate SBOM (audit F-15)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.TAG }}" dist/sbom.cdx.json
