name: Build xcframework

on:
  workflow_dispatch: {}
  workflow_call: {}

# Serialize concurrent publishes — the version-bump step reads existing tags
# and races would mint duplicate versions. (Tag-only commits, see below, mean
# we no longer race over a shared main ref.)
concurrency:
  group: publish-swift
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14 # Apple Silicon runner
    permissions:
      # Audit F-15: SLSA build-provenance attestation needs an OIDC token
      # exchanged for a Sigstore signing cert, plus write access to push the
      # attestation to GitHub's attestation store and the release. Provenance
      # is the only external defense against the "zip + checksum produced by
      # the same workflow run" structural concern called out in F-22.
      id-token: write
      attestations: write
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      - name: Determine version
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')

          # Auto-increment build number: v0.0.1-alpha.1, v0.0.1-alpha.2, ...
          git fetch --tags
          # Extract trailing BUILD number and sort numerically; the old
          # `sort -t. -k5 -n` fell back to alphabetical (would break at BUILD >= 10).
          BUILD=$(git tag -l "v${BASE}.*" | grep -oE '[0-9]+$' | sort -n | tail -1)
          if [ -n "$BUILD" ]; then
            BUILD=$((BUILD + 1))
          else
            BUILD=1
          fi

          VERSION="${BASE}.${BUILD}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "Building release: v$VERSION"

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.16.0'

      - name: Switch to CommandLineTools (for Zig libc linkage)
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Build macOS targets
        run: |
          for target in aarch64-macos x86_64-macos; do
            echo "=== Building $target ==="
            rm -rf zig-out
            zig build -Doptimize=ReleaseFast -Dtarget=$target -Dstatic-only=true
            mkdir -p dist/$target
            cp zig-out/lib/libzerodev_aa.a dist/$target/

            # Repack with libtool for Xcode compatibility (secp256k1 is now
            # bundled inside libzerodev_aa.a via zabi → no separate archive)
            tmpdir=$(mktemp -d)
            cd "$tmpdir"
            ar x "$GITHUB_WORKSPACE/dist/$target/libzerodev_aa.a"
            chmod 644 *.o
            libtool -static -o "$GITHUB_WORKSPACE/dist/$target/libzerodev_aa.a" *.o
            cd "$GITHUB_WORKSPACE"
            rm -rf "$tmpdir"
          done

      - name: Build iOS targets
        run: |
          IOS_SDK=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk
          SIM_SDK=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk

          for target_info in "aarch64-ios:$IOS_SDK" "aarch64-ios-simulator:$SIM_SDK" "x86_64-ios-simulator:$SIM_SDK"; do
            target="${target_info%%:*}"
            sdk="${target_info#*:}"
            echo "=== Building $target ==="
            rm -rf zig-out
            DEVELOPER_DIR=/Library/Developer/CommandLineTools \
            C_INCLUDE_PATH="$sdk/usr/include" \
            zig build -Doptimize=ReleaseFast -Dtarget=$target -Dstatic-only=true \
              --sysroot "$sdk"
            mkdir -p dist/$target
            cp zig-out/lib/libzerodev_aa.a dist/$target/

            # Repack with libtool for Xcode compatibility
            tmpdir=$(mktemp -d)
            cd "$tmpdir"
            ar x "$GITHUB_WORKSPACE/dist/$target/libzerodev_aa.a"
            chmod 644 *.o
            libtool -static -o "$GITHUB_WORKSPACE/dist/$target/libzerodev_aa.a" *.o
            cd "$GITHUB_WORKSPACE"
            rm -rf "$tmpdir"
          done

      - name: Create merged static libs
        run: |
          for target_dir in dist/aarch64-macos dist/x86_64-macos dist/aarch64-ios dist/aarch64-ios-simulator dist/x86_64-ios-simulator; do
            if [ -f "$target_dir/libzerodev_aa.a" ]; then
              # secp256k1 is bundled inside libzerodev_aa.a via zabi — single archive
              cp "$target_dir/libzerodev_aa.a" "$target_dir/libZeroDevAA.a"
              echo "Staged: $target_dir/libZeroDevAA.a"
            fi
          done

      - name: Create fat binaries
        run: |
          # macOS universal (arm64 + x86_64)
          mkdir -p dist/macos-universal
          lipo -create dist/aarch64-macos/libZeroDevAA.a dist/x86_64-macos/libZeroDevAA.a \
               -output dist/macos-universal/libZeroDevAA.a
          echo "macOS universal: $(lipo -info dist/macos-universal/libZeroDevAA.a)"

          # iOS simulator universal (arm64 + x86_64)
          if [ -f dist/aarch64-ios-simulator/libZeroDevAA.a ] && [ -f dist/x86_64-ios-simulator/libZeroDevAA.a ]; then
            mkdir -p dist/ios-simulator-universal
            lipo -create dist/aarch64-ios-simulator/libZeroDevAA.a dist/x86_64-ios-simulator/libZeroDevAA.a \
                 -output dist/ios-simulator-universal/libZeroDevAA.a
            echo "iOS sim universal: $(lipo -info dist/ios-simulator-universal/libZeroDevAA.a)"
          fi

      - name: Switch to Xcode for xcodebuild
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Create xcframework
        run: |
          XCF_ARGS=(-create-xcframework)

          # macOS
          XCF_ARGS+=(-library dist/macos-universal/libZeroDevAA.a -headers include)

          # iOS device
          if [ -f dist/aarch64-ios/libZeroDevAA.a ]; then
            XCF_ARGS+=(-library dist/aarch64-ios/libZeroDevAA.a -headers include)
          fi

          # iOS simulator (universal if both archs available)
          if [ -f dist/ios-simulator-universal/libZeroDevAA.a ]; then
            XCF_ARGS+=(-library dist/ios-simulator-universal/libZeroDevAA.a -headers include)
          elif [ -f dist/aarch64-ios-simulator/libZeroDevAA.a ]; then
            XCF_ARGS+=(-library dist/aarch64-ios-simulator/libZeroDevAA.a -headers include)
          fi

          XCF_ARGS+=(-output dist/ZeroDevAA.xcframework)
          rm -rf dist/ZeroDevAA.xcframework
          xcodebuild "${XCF_ARGS[@]}"

          # Add module map
          for dir in dist/ZeroDevAA.xcframework/*/Headers; do
            cat > "$dir/module.modulemap" << 'EOF'
          module CZeroDevAA {
              header "aa.h"
              export *
          }
          EOF
          done

      - name: Package + checksum
        run: |
          cd dist
          zip -r ZeroDevAA.xcframework.zip ZeroDevAA.xcframework
          CHECKSUM=$(shasum -a 256 ZeroDevAA.xcframework.zip | cut -d' ' -f1)
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "SHA256: $CHECKSUM"

      - name: Verify Swift build
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          cd bindings/swift
          SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk swift build --target ZeroDevAA

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: ZeroDevAA.xcframework
          path: dist/ZeroDevAA.xcframework.zip

      - name: Update Package.swift and tag (tag-only commit; main stays clean)
        # Audit F-22: previously this committed Package.swift's url + checksum
        # to main with `[skip ci]`. With the zip and the matching checksum
        # being produced by the same workflow run, SPM's checksum verification
        # provided zero defense against a compromised workflow. The release
        # commit now lives only at the tag ref — `git push origin <tag>`
        # pushes the tag + the commit it points at, without advancing main.
        # SPM consumers resolve via the tag and see the updated Package.swift;
        # main keeps its placeholder url/checksum.
        run: |
          TAG="${{ env.TAG }}"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Swift release tags are immutable."
            exit 1
          fi

          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/ZeroDevAA.xcframework.zip"

          sed -i '' "s|url: \".*ZeroDevAA.xcframework.zip\"|url: \"$URL\"|" Package.swift
          sed -i '' "s|checksum: \".*\"|checksum: \"${{ env.CHECKSUM }}\"|" Package.swift

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release(swift): xcframework $TAG"

          git tag "$TAG"
          git push origin "$TAG"

          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.0.4
        with:
          tag_name: ${{ env.TAG }}
          files: dist/ZeroDevAA.xcframework.zip
          body: |
            ## ZeroDevAA xcframework

            **SHA256:** `${{ env.CHECKSUM }}`

            ### Swift Package Manager
            ```swift
            .package(url: "https://github.com/${{ github.repository }}.git", from: "${{ github.event.inputs.version }}")
            ```

      - name: Attest build provenance (audit F-15)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: 'dist/ZeroDevAA.xcframework.zip'

      - name: Generate SBOM (audit F-15)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.TAG }}" dist/sbom.cdx.json
